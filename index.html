<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Happy Rakshabandhan Didi ❤️</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            height: 100vh;
            overflow: hidden;
            background: #000;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Georgia, serif;
        }

        /* Soft aesthetic glow */
        .background-glow {
            position: fixed;
            width: 280px;
            height: 280px;

            border-radius: 50%;
            background: rgba(255, 100, 150, 0.15);

            filter: blur(90px);
            animation: glow 5s ease-in-out infinite alternate;
        }

        .container {
            position: relative;
            z-index: 2;

            text-align: center;
            padding: 20px;
        }

        .line {
            margin: 8px 0;
        }

        .letter {
            display: inline-block;

            color: white;
            font-size: clamp(28px, 8vw, 55px);
            font-weight: bold;

            opacity: 0;
            transform: scale(0) translateY(20px);

            text-shadow:
                0 0 10px rgba(255,255,255,0.7),
                0 0 25px rgba(255,100,150,0.5);

            animation: letterPop 0.65s cubic-bezier(.17,.67,.3,1.4) forwards;
        }

        .didi {
            color: #ffb6d5;

            font-size: clamp(32px, 9vw, 62px);

            text-shadow:
                0 0 10px #ffb6d5,
                0 0 30px rgba(255,80,150,0.8);
        }

        .heart {
            display: inline-block;

            font-size: 42px;
            margin: 8px;

            opacity: 0;
            transform: scale(0);

            animation: heartPop 1s ease forwards;
        }

        @keyframes letterPop {

            0% {
                opacity: 0;
                transform: scale(0) translateY(25px);
            }

            60% {
                opacity: 1;
                transform: scale(1.25) translateY(-5px);
            }

            100% {
                opacity: 1;
                transform: scale(1) translateY(0);
            }
        }

        @keyframes heartPop {

            0% {
                opacity: 0;
                transform: scale(0);
            }

            60% {
                opacity: 1;
                transform: scale(1.35);
            }

            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes glow {

            from {
                transform: scale(0.8);
                opacity: 0.5;
            }

            to {
                transform: scale(1.4);
                opacity: 1;
            }
        }

        /* Floating hearts */
        .floating-heart {
            position: fixed;
            bottom: -30px;

            font-size: 20px;
            opacity: 0;

            animation: floatUp 5s linear infinite;
        }

        @keyframes floatUp {

            0% {
                transform: translateY(0) scale(0.5);
                opacity: 0;
            }

            20% {
                opacity: 0.8;
            }

            100% {
                transform: translateY(-110vh) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>

<body>

    <div class="background-glow"></div>

    <div class="container">

        <div class="line" id="first"></div>

        <div class="line" id="second"></div>

        <div id="hearts"></div>

    </div>

    <script>

        const firstText = "HAPPY RAKSHABANDHAN";
        const secondText = "DIDI";

        let delay = 0;

        function createLetters(text, element, isDidi = false) {

            [...text].forEach(letter => {

                if (letter === " ") {

                    const space = document.createTextNode(" ");
                    element.appendChild(space);

                    delay += 120;
                    return;
                }

                const span = document.createElement("span");

                span.className = "letter";

                if (isDidi) {
                    span.classList.add("didi");
                }

                span.textContent = letter;

                span.style.animationDelay = delay + "ms";

                element.appendChild(span);

                delay += 150;
            });
        }

        createLetters(
            firstText,
            document.getElementById("first")
        );

        createLetters(
            secondText,
            document.getElementById("second"),
            true
        );


        /* Hearts appear after all letters */

        setTimeout(() => {

            const hearts = document.getElementById("hearts");

            ["❤️", "💕", "💗", "💖", "❤️"].forEach((heart, index) => {

                const span = document.createElement("span");

                span.className = "heart";
                span.textContent = heart;

                span.style.animationDelay =
                    (index * 180) + "ms";

                hearts.appendChild(span);

            });

        }, delay + 400);


        /* Floating hearts */

        function createFloatingHeart() {

            const heart = document.createElement("div");

            heart.className = "floating-heart";

            const hearts = ["❤️", "💕", "💗", "💖"];

            heart.textContent =
                hearts[Math.floor(Math.random() * hearts.length)];

            heart.style.left =
                Math.random() * 100 + "vw";

            heart.style.animationDuration =
                (4 + Math.random() * 3) + "s";

            document.body.appendChild(heart);

            setTimeout(() => {
                heart.remove();
            }, 7000);
        }

        setInterval(createFloatingHeart, 700);

    </script>

</body>
</html>
