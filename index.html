<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Village Morning 🌅</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #06131c;
    font-family: Georgia, serif;
}

.scene {
    position: relative;
    width: 100%;
    height: 100vh;
    overflow: hidden;

    background:
        linear-gradient(
            to bottom,
            #061522 0%,
            #17384d 30%,
            #9d5545 57%,
            #e49b5b 73%,
            #60934f 100%
        );
}

/* ---------------- SUN ---------------- */

.sun {
    position: absolute;

    width: 105px;
    height: 105px;

    border-radius: 50%;

    background: #ff5835;

    box-shadow:
        0 0 25px #ff7045,
        0 0 70px rgba(255,100,40,.7),
        0 0 130px rgba(255,130,60,.35);

    left: 50%;
    top: 72%;

    transform: translate(-50%, -50%);

    animation: sunrise 8s ease-out forwards;
}

@keyframes sunrise {

    0% {
        top: 82%;
        opacity: 0;
        transform: translate(-50%, 0) scale(.65);
    }

    100% {
        top: 40%;
        opacity: 1;
        transform: translate(-50%, 0) scale(1);
    }
}

/* ---------------- LIGHT ---------------- */

.light {
    position: absolute;
    inset: 0;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(255,180,90,.3),
            transparent 38%
        );

    opacity: 0;

    animation: lightAppear 7s ease forwards;
}

@keyframes lightAppear {

    from {
        opacity: 0;
    }

    to {
        opacity: 1;
    }
}

/* ---------------- DISTANT LAND ---------------- */

.land {
    position: absolute;

    bottom: 34%;
    width: 100%;
    height: 150px;

    background:
        radial-gradient(
            ellipse at 15% 100%,
            #285438 0 35%,
            transparent 36%
        ),
        radial-gradient(
            ellipse at 45% 100%,
            #234d35 0 38%,
            transparent 39%
        ),
        radial-gradient(
            ellipse at 80% 100%,
            #1d4931 0 40%,
            transparent 41%
        );
}

/* ---------------- RIVER ---------------- */

.river {
    position: absolute;

    bottom: -5%;
    left: 30%;

    width: 40%;
    height: 70%;

    background:
        linear-gradient(
            90deg,
            #235b65,
            #4f9aa0,
            #27626b
        );

    clip-path: polygon(
        43% 0,
        57% 0,
        100% 100%,
        0 100%
    );

    opacity: .95;

    box-shadow:
        inset 0 0 35px rgba(255,255,255,.18);
}

/* Moving water */

.water {
    position: absolute;

    width: 160%;
    height: 100%;

    left: -30%;

    background:
        repeating-linear-gradient(
            170deg,
            transparent 0px,
            transparent 18px,
            rgba(255,255,255,.22) 19px,
            transparent 21px,
            transparent 40px
        );

    animation: waterMove 2.5s linear infinite;
}

@keyframes waterMove {

    from {
        transform: translateX(-30px);
    }

    to {
        transform: translateX(30px);
    }
}

/* ---------------- FIELDS ---------------- */

.field {
    position: absolute;

    bottom: 0;
    width: 100%;
    height: 35%;

    background:
        repeating-linear-gradient(
            165deg,
            #4b8b43 0px,
            #4b8b43 13px,
            #356f39 14px,
            #356f39 27px
        );

    animation: grassMove 4s ease-in-out infinite alternate;
}

@keyframes grassMove {

    from {
        transform: skewX(-1deg);
    }

    to {
        transform: skewX(1deg);
    }
}

/* ---------------- VILLAGE HOUSE ---------------- */

.house {
    position: absolute;

    bottom: 31%;
    left: 9%;

    width: 115px;
    height: 75px;

    background: #a96845;

    box-shadow:
        inset 0 0 20px rgba(0,0,0,.3);
}

.roof {
    position: absolute;

    top: -42px;
    left: -18px;

    width: 150px;
    height: 55px;

    background: #553528;

    clip-path: polygon(
        50% 0,
        100% 100%,
        0 100%
    );
}

.door {
    position: absolute;

    bottom: 0;
    left: 45px;

    width: 25px;
    height: 45px;

    background: #33231c;
}

/* ---------------- TREES ---------------- */

.tree {
    position: absolute;
    bottom: 30%;
}

.tree1 {
    right: 8%;
}

.tree2 {
    right: 20%;
    transform: scale(.75);
}

.trunk {
    width: 17px;
    height: 90px;

    margin: auto;

    background: #4b3023;
}

.leaves {
    width: 110px;
    height: 110px;

    border-radius: 50%;

    background:
        radial-gradient(
            circle at 30% 30%,
            #6da94d,
            transparent 35%
        ),
        radial-gradient(
            circle at 70% 30%,
            #3e833d,
            transparent 40%
        ),
        #286536;

    box-shadow:
        20px 10px 0 #347438,
        -18px 15px 0 #397c3c;
}

/* ---------------- MIST ---------------- */

.mist {
    position: absolute;

    left: -20%;
    bottom: 30%;

    width: 140%;
    height: 80px;

    background: rgba(255,255,255,.12);

    filter: blur(25px);

    animation: mistMove 10s linear infinite;
}

@keyframes mistMove {

    from {
        transform: translateX(-5%);
    }

    to {
        transform: translateX(10%);
    }
}

/* ---------------- BIRDS ---------------- */

.bird {
    position: absolute;

    font-size: 23px;

    color: #111;

    opacity: 0;

    animation: birdFly 7s linear infinite;
}

.bird1 {
    top: 23%;
    left: -10%;
    animation-delay: 2s;
}

.bird2 {
    top: 17%;
    left: -20%;
    font-size: 17px;
    animation-delay: 4s;
}

.bird3 {
    top: 30%;
    left: -15%;
    font-size: 19px;
    animation-delay: 5.5s;
}

@keyframes birdFly {

    0% {
        transform: translate(0,20px);
        opacity: 0;
    }

    10% {
        opacity: 1;
    }

    50% {
        transform: translate(55vw,-30px);
        opacity: 1;
    }

    100% {
        transform: translate(120vw,20px);
        opacity: 0;
    }
}

/* ---------------- MESSAGE ---------------- */

.message {
    position: absolute;

    top: 11%;
    width: 100%;

    text-align: center;

    color: white;

    opacity: 0;

    text-shadow:
        0 2px 12px rgba(0,0,0,.8);

    animation: messageShow 4s ease forwards;
    animation-delay: 12s;
}

.message h1 {
    margin: 0;

    font-size: clamp(30px,7vw,55px);

    letter-spacing: 3px;
}

.message p {
    margin-top: 12px;

    font-size: 16px;

    letter-spacing: 2px;
}

@keyframes messageShow {

    from {
        opacity: 0;
        transform: translateY(20px);
    }

    to {
        opacity: 1;
        transform: translateY(0);
    }
}

/* ---------------- VIGNETTE ---------------- */

.vignette {
    position: absolute;
    inset: 0;

    pointer-events: none;

    box-shadow:
        inset 0 0 120px rgba(0,0,0,.65);
}
</style>
</head>

<body>

<div class="scene">

    <div class="light"></div>

    <div class="sun"></div>

    <!-- River is present from the beginning -->
    <div class="river">
        <div class="water"></div>
    </div>

    <div class="land"></div>

    <div class="mist"></div>

    <div class="field"></div>

    <!-- Village house -->
    <div class="house">
        <div class="roof"></div>
        <div class="door"></div>
    </div>

    <!-- Trees -->
    <div class="tree tree1">
        <div class="leaves"></div>
        <div class="trunk"></div>
    </div>

    <div class="tree tree2">
        <div class="leaves"></div>
        <div class="trunk"></div>
    </div>

    <!-- Birds -->
    <div class="bird bird1">⌁⌁</div>
    <div class="bird bird2">⌁⌁</div>
    <div class="bird bird3">⌁⌁</div>

    <!-- Final message -->
    <div class="message">
        <h1>Good Morning 🌅</h1>
        <p>A beautiful new day begins...</p>
    </div>

    <div class="vignette"></div>

</div>

</body>
</html>
