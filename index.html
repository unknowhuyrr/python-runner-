<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Moonlight 🌙</title>

<style>
*{
    box-sizing:border-box;
}

html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#02050c;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
}

.quote{
    position:absolute;
    bottom:7%;
    width:100%;
    text-align:center;
    color:#dce6ff;
    font-family:Georgia,serif;
    opacity:0;
    animation:fadeIn 3s ease forwards;
    animation-delay:8s;
    text-shadow:0 0 18px rgba(180,210,255,.7);
}

.quote h1{
    margin:0;
    font-size:clamp(24px,7vw,44px);
    font-weight:normal;
    letter-spacing:4px;
}

.quote p{
    margin:10px 0 0;
    font-size:12px;
    letter-spacing:2px;
    opacity:.65;
}

@keyframes fadeIn{
    to{
        opacity:1;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="quote">
    <h1>Walking Alone</h1>
    <p>Some roses are carried for memories. 🌹</p>
</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let W,H;

function resize(){
    W=canvas.width=innerWidth;
    H=canvas.height=innerHeight;
}

resize();
addEventListener("resize",resize);


/* =========================
        STARS
========================= */

const stars=[];

for(let i=0;i<220;i++){

    stars.push({
        x:Math.random(),
        y:Math.random()*.65,
        r:Math.random()*1.4+.2,
        tw:Math.random()*6
    });
}


/* =========================
        BIRDS
========================= */

const birds=[];

for(let i=0;i<7;i++){

    birds.push({
        x:-Math.random()*W,
        y:H*.18+Math.random()*H*.25,
        speed:.5+Math.random()*.5,
        size:4+Math.random()*4,
        phase:Math.random()*10
    });
}


/* =========================
        LEAVES
========================= */

const leaves=[];

for(let i=0;i<35;i++){

    leaves.push({
        x:Math.random()*W,
        y:H*.55+Math.random()*H*.4,
        size:3+Math.random()*5,
        speed:.8+Math.random()*1.5,
        angle:Math.random()*6,
        spin:.03+Math.random()*.06
    });
}


/* =========================
        CLOUDS
========================= */

const clouds=[];

for(let i=0;i<5;i++){

    clouds.push({
        x:Math.random()*W,
        y:70+Math.random()*170,
        w:150+Math.random()*220,
        speed:.12+Math.random()*.18
    });
}


/* =========================
          MOON
========================= */

function drawMoon(){

    const mx=W*.76;
    const my=H*.19;

    /* Moon glow */

    const glow=ctx.createRadialGradient(
        mx,my,5,
        mx,my,190
    );

    glow.addColorStop(
        0,
        "rgba(220,235,255,.35)"
    );

    glow.addColorStop(
        1,
        "rgba(130,170,255,0)"
    );

    ctx.fillStyle=glow;

    ctx.beginPath();
    ctx.arc(mx,my,190,0,Math.PI*2);
    ctx.fill();


    /* Moon */

    const moon=ctx.createRadialGradient(
        mx-15,my-15,5,
        mx,my,52
    );

    moon.addColorStop(0,"#ffffff");
    moon.addColorStop(.75,"#e6edff");
    moon.addColorStop(1,"#b7c5dd");

    ctx.fillStyle=moon;

    ctx.beginPath();
    ctx.arc(mx,my,52,0,Math.PI*2);
    ctx.fill();


    /* Craters */

    ctx.fillStyle="rgba(100,115,145,.13)";

    const craters=[
        [-18,-12,7],
        [17,15,6],
        [20,-19,8],
        [-20,20,4],
        [2,-27,4]
    ];

    craters.forEach(c=>{

        ctx.beginPath();

        ctx.arc(
            mx+c[0],
            my+c[1],
            c[2],
            0,
            Math.PI*2
        );

        ctx.fill();

    });
}


/* =========================
          CLOUDS
========================= */

function drawCloud(c){

    ctx.fillStyle="rgba(120,135,165,.07)";

    ctx.beginPath();

    ctx.ellipse(
        c.x,
        c.y,
        c.w,
        28,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        c.x-c.w*.35,
        c.y+3,
        c.w*.35,
        23,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();

    ctx.beginPath();

    ctx.ellipse(
        c.x+c.w*.35,
        c.y+4,
        c.w*.4,
        25,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();
}


/* =========================
          GROUND
========================= */

function drawGround(time){

    const ground=ctx.createLinearGradient(
        0,H*.60,
        0,H
    );

    ground.addColorStop(0,"#16231f");
    ground.addColorStop(1,"#020504");

    ctx.fillStyle=ground;

    ctx.fillRect(
        0,
        H*.60,
        W,
        H*.40
    );


    /* Moving grass */

    ctx.strokeStyle="rgba(42,70,55,.65)";
    ctx.lineWidth=1;

    for(let i=0;i<280;i++){

        const x=(i*47)%W;
        const y=H*.64+(i*29)%Math.floor(H*.36);

        const wind=
            Math.sin(time*.002+x*.02)*5;

        ctx.beginPath();

        ctx.moveTo(x,y);

        ctx.quadraticCurveTo(
            x+wind,
            y-12,
            x+wind+3,
            y-20
        );

        ctx.stroke();
    }
}


/* =========================
      ANIME CHARACTER
========================= */

function drawCharacter(time){

    /*
       Walking position
    */

    const x=
        W*.39+
        Math.sin(time*.0008)*W*.035;

    const feet=H*.75;

    const walk=
        Math.sin(time*.006)*13;


    /* =====================
          LONG SHADOW
    ===================== */

    const moonX=W*.76;

    const shadowX=
        x-(moonX-x)*3.4;

    const shadowY=
        feet+18;


    const shadowGradient=
        ctx.createLinearGradient(
            x,
            feet,
            shadowX,
            shadowY
        );

    shadowGradient.addColorStop(
        0,
        "rgba(0,0,0,.82)"
    );

    shadowGradient.addColorStop(
        .55,
        "rgba(0,0,0,.45)"
    );

    shadowGradient.addColorStop(
        1,
        "rgba(0,0,0,0)"
    );

    ctx.fillStyle=shadowGradient;

    ctx.beginPath();

    ctx.moveTo(x-12,feet);
    ctx.lineTo(shadowX-55,shadowY);
    ctx.lineTo(shadowX+55,shadowY);
    ctx.lineTo(x+12,feet);

    ctx.closePath();

    ctx.fill();


    /* =====================
       CHARACTER GLOW
    ===================== */

    ctx.shadowBlur=18;
    ctx.shadowColor="rgba(190,215,255,.18)";


    /* =====================
            COAT
    ===================== */

    ctx.fillStyle="#05080e";

    ctx.beginPath();

    /*
       Long anime-style coat
    */

    ctx.moveTo(x-19,feet-160);

    ctx.quadraticCurveTo(
        x-32,
        feet-115,
        x-42,
        feet-35
    );

    ctx.lineTo(
        x-17,
        feet-40
    );

    ctx.lineTo(
        x,
        feet-55
    );

    ctx.lineTo(
        x+18,
        feet-40
    );

    ctx.lineTo(
        x+42,
        feet-35
    );

    ctx.quadraticCurveTo(
        x+32,
        feet-115,
        x+19,
        feet-160
    );

    ctx.closePath();

    ctx.fill();


    /* =====================
             HEAD
    ===================== */

    ctx.shadowBlur=0;

    ctx.fillStyle="#05070c";

    ctx.beginPath();

    ctx.ellipse(
        x,
        feet-185,
        22,
        29,
        -.08,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =====================
          ANIME HAIR
    ===================== */

    ctx.beginPath();

    ctx.moveTo(x-23,feet-193);

    ctx.quadraticCurveTo(
        x-15,
        feet-222,
        x+10,
        feet-214
    );

    ctx.quadraticCurveTo(
        x+28,
        feet-204,
        x+25,
        feet-184
    );

    /* Hair spikes */

    ctx.lineTo(x+36,feet-179);
    ctx.lineTo(x+23,feet-174);
    ctx.lineTo(x+30,feet-165);
    ctx.lineTo(x+12,feet-176);

    ctx.lineTo(x-5,feet-168);
    ctx.lineTo(x-17,feet-180);
    ctx.lineTo(x-30,feet-176);

    ctx.closePath();

    ctx.fill();


    /* =====================
          LEGS
    ===================== */

    ctx.strokeStyle="#04070c";
    ctx.lineWidth=11;
    ctx.lineCap="round";

    ctx.beginPath();

    /* Walking legs */

    ctx.moveTo(
        x-10,
        feet-48
    );

    ctx.lineTo(
        x-17+walk,
        feet
    );

    ctx.moveTo(
        x+10,
        feet-48
    );

    ctx.lineTo(
        x+17-walk,
        feet
    );

    ctx.stroke();


    /* =====================
          LEFT ARM
    ===================== */

    ctx.strokeStyle="#05080e";
    ctx.lineWidth=10;

    ctx.beginPath();

    ctx.moveTo(
        x-20,
        feet-140
    );

    ctx.lineTo(
        x-45,
        feet-83
    );

    ctx.stroke();


    /* =====================
       RIGHT ARM + ROSE
    ===================== */

    ctx.beginPath();

    ctx.moveTo(
        x+20,
        feet-140
    );

    ctx.quadraticCurveTo(
        x+40,
        feet-115,
        x+33,
        feet-82
    );

    ctx.stroke();


    /* Hand */

    ctx.fillStyle="#080b11";

    ctx.beginPath();

    ctx.arc(
        x+33,
        feet-80,
        6,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* =====================
            ROSE 🌹
    ===================== */

    const rx=x+38;
    const ry=feet-122;

    /* Stem */

    ctx.strokeStyle="#294331";
    ctx.lineWidth=2.5;

    ctx.beginPath();

    ctx.moveTo(
        x+33,
        feet-82
    );

    ctx.lineTo(
        rx,
        ry
    );

    ctx.stroke();


    /* Leaf */

    ctx.fillStyle="#385a3d";

    ctx.beginPath();

    ctx.ellipse(
        rx-2,
        ry+22,
        9,
        4,
        -.5,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Rose glow */

    ctx.shadowBlur=18;
    ctx.shadowColor="rgba(255,45,75,.75)";

    ctx.fillStyle="#c52142";

    ctx.beginPath();

    ctx.arc(
        rx,
        ry-7,
        9,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Petals */

    ctx.fillStyle="#ef3655";

    for(let i=0;i<6;i++){

        const a=i*Math.PI/3;

        ctx.beginPath();

        ctx.arc(
            rx+Math.cos(a)*5,
            ry-7+Math.sin(a)*5,
            5,
            0,
            Math.PI*2
        );

        ctx.fill();
    }

    ctx.shadowBlur=0;
}


/* =========================
          BIRDS
========================= */

function drawBirds(time){

    birds.forEach((b,i)=>{

        b.x+=b.speed;

        b.y+=Math.sin(
            time*.002+b.phase
        )*.18;

        if(b.x>W+50){
            b.x=-50;
            b.y=H*.18+Math.random()*H*.25;
        }

        const flap=
            Math.sin(time*.01+i)*5;

        ctx.strokeStyle="rgba(8,12,20,.85)";
        ctx.lineWidth=1.8;
        ctx.lineCap="round";

        ctx.beginPath();

        ctx.moveTo(
            b.x-b.size,
            b.y
        );

        ctx.quadraticCurveTo(
            b.x-b.size/2,
            b.y-flap,
            b.x,
            b.y
        );

        ctx.quadraticCurveTo(
            b.x+b.size/2,
            b.y-flap,
            b.x+b.size,
            b.y
        );

        ctx.stroke();
    });
}


/* =========================
        FLYING LEAVES
========================= */

function drawLeaves(time){

    leaves.forEach((l,i)=>{

        l.x+=l.speed;

        l.y+=
            Math.sin(
                time*.003+i
            )*.8;

        l.angle+=l.spin;

        if(l.x>W+30){

            l.x=-30;
            l.y=H*.55+Math.random()*H*.35;
        }

        ctx.save();

        ctx.translate(l.x,l.y);
        ctx.rotate(l.angle);

        ctx.fillStyle="rgba(91,112,75,.65)";

        ctx.beginPath();

        ctx.ellipse(
            0,
            0,
            l.size,
            l.size*.45,
            0,
            0,
            Math.PI*2
        );

        ctx.fill();

        ctx.restore();
    });
}


/* =========================
            FOG
========================= */

function drawFog(time){

    const fogY=
        H*.66+
        Math.sin(time*.0004)*8;

    const fog=ctx.createLinearGradient(
        0,
        fogY,
        0,
        H
    );

    fog.addColorStop(
        0,
        "rgba(170,190,190,.02)"
    );

    fog.addColorStop(
        .5,
        "rgba(170,190,190,.07)"
    );

    fog.addColorStop(
        1,
        "rgba(170,190,190,0)"
    );

    ctx.fillStyle=fog;

    ctx.fillRect(
        0,
        fogY,
        W,
        H-fogY
    );
}


/* =========================
          ANIMATION
========================= */

function animate(time){

    /* Sky */

    const sky=ctx.createLinearGradient(
        0,0,
        0,H
    );

    sky.addColorStop(
        0,
        "#01030a"
    );

    sky.addColorStop(
        .45,
        "#071327"
    );

    sky.addColorStop(
        1,
        "#13221e"
    );

    ctx.fillStyle=sky;

    ctx.fillRect(
        0,0,W,H
    );


    /* Stars */

    stars.forEach((s,i)=>{

        const alpha=
            .3+
            Math.sin(
                time*.002+s.tw
            )*.3;

        ctx.fillStyle=
            `rgba(225,235,255,${alpha})`;

        ctx.beginPath();

        ctx.arc(
            s.x*W,
            s.y*H,
            s.r,
            0,
            Math.PI*2
        );

        ctx.fill();
    });


    drawMoon();


    /* Clouds */

    clouds.forEach(c=>{

        c.x+=c.speed;

        if(c.x-c.w>W){
            c.x=-c.w;
        }

        drawCloud(c);
    });


    drawGround(time);

    drawBirds(time);

    drawLeaves(time);

    drawFog(time);

    /*
       Character appears
       after the scene begins.
    */

    if(time>1200){
        drawCharacter(time);
    }


    requestAnimationFrame(animate);
}

requestAnimationFrame(animate);

</script>

</body>
</html>
