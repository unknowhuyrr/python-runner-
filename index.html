<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>For You ❤️</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
}

body {
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: Arial, sans-serif;
}

/* Background */

#canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
}

/* Center content */

.message {
    position: absolute;
    text-align: center;

    color: white;

    opacity: 0;
    transform: scale(.5);

    animation: showMessage 2s ease forwards;
    animation-delay: 5s;

    text-shadow:
        0 0 10px rgba(255,255,255,.8),
        0 0 30px rgba(255,50,100,.7);
}

.message .heart {
    font-size: 75px;

    display: block;

    animation:
        heartbeat 1.2s infinite;
}

.message h1 {
    margin: 10px 0 0;

    font-size: clamp(25px, 7vw, 48px);

    letter-spacing: 3px;
}

.message p {
    margin-top: 10px;

    font-size: 15px;

    letter-spacing: 2px;

    opacity: .75;
}

@keyframes showMessage {

    from {
        opacity: 0;
        transform: scale(.5);
    }

    to {
        opacity: 1;
        transform: scale(1);
    }
}

@keyframes heartbeat {

    0%, 100% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.18);
    }
}

/* Small screen effect */

.flash {
    position: fixed;
    inset: 0;

    background: white;

    opacity: 0;

    pointer-events: none;

    animation: flash .7s ease;
    animation-delay: 4.8s;
}

@keyframes flash {

    0% {
        opacity: 0;
    }

    20% {
        opacity: .12;
    }

    100% {
        opacity: 0;
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<div class="flash"></div>

<div class="message">

    <span class="heart">❤️</span>

    <h1>For You</h1>

    <p>Some feelings need no words ✨</p>

</div>

<script>

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let width;
let height;

function resize() {

    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;

}

resize();

window.addEventListener("resize", resize);


/* --------------------------------
   PARTICLES
-------------------------------- */

const particles = [];

for (let i = 0; i < 140; i++) {

    particles.push({

        x: Math.random() * width,

        y: Math.random() * height,

        size: Math.random() * 2 + .5,

        speed: Math.random() * .5 + .1,

        alpha: Math.random(),

        twinkle: Math.random() * .05

    });

}


/* --------------------------------
   HEART POSITION
-------------------------------- */

function heartPosition(t, scale) {

    const x =
        16 * Math.pow(Math.sin(t), 3);

    const y =
        -(13 * Math.cos(t)
        - 5 * Math.cos(2*t)
        - 2 * Math.cos(3*t)
        - Math.cos(4*t));

    return {

        x: width / 2 + x * scale,

        y: height / 2 + y * scale

    };

}


/* --------------------------------
   HEART PARTICLES
-------------------------------- */

const hearts = [];

for (let i = 0; i < 220; i++) {

    const t =
        Math.random() * Math.PI * 2;

    const pos =
        heartPosition(
            t,
            Math.min(width, height) / 35
        );

    hearts.push({

        x: Math.random() * width,

        y: Math.random() * height,

        targetX: pos.x,

        targetY: pos.y,

        size: Math.random() * 3 + 1,

        delay: Math.random() * 3,

        progress: 0

    });

}


/* --------------------------------
   DRAW
-------------------------------- */

let start = performance.now();

function animate(time) {

    const elapsed =
        (time - start) / 1000;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    /* Stars / particles */

    particles.forEach(p => {

        p.alpha += p.twinkle;

        if (p.alpha > 1 || p.alpha < .1) {
            p.twinkle *= -1;
        }

        p.y -= p.speed;

        if (p.y < 0) {
            p.y = height;
        }

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,255,255,${p.alpha})`;

        ctx.fill();

    });


    /* Heart formation */

    hearts.forEach(h => {

        let progress =
            Math.max(
                0,
                Math.min(
                    1,
                    (elapsed - h.delay) / 2
                )
            );

        /* Smooth movement */

        const ease =
            progress * progress *
            (3 - 2 * progress);

        const x =
            h.x +
            (h.targetX - h.x) * ease;

        const y =
            h.y +
            (h.targetY - h.y) * ease;


        /* Glow */

        ctx.shadowBlur = 18;

        ctx.shadowColor =
            "rgba(255,40,100,.9)";


        ctx.beginPath();

        ctx.arc(
            x,
            y,
            h.size,
            0,
            Math.PI * 2
        );

        ctx.fillStyle =
            `rgba(255,70,120,${.25 + progress * .75})`;

        ctx.fill();

        ctx.shadowBlur = 0;

    });


    /* Large glowing heart outline */

    if (elapsed > 3) {

        const pulse =
            1 +
            Math.sin(elapsed * 4) * .03;

        ctx.save();

        ctx.translate(
            width / 2,
            height / 2
        );

        ctx.scale(
            pulse,
            pulse
        );

        ctx.beginPath();

        for (
            let t = 0;
            t <= Math.PI * 2;
            t += .02
        ) {

            const x =
                16 * Math.pow(Math.sin(t), 3)
                * Math.min(width,height) / 35;

            const y =
                -(13 * Math.cos(t)
                - 5 * Math.cos(2*t)
                - 2 * Math.cos(3*t)
                - Math.cos(4*t))
                * Math.min(width,height) / 35;

            if (t === 0) {
                ctx.moveTo(x,y);
            } else {
                ctx.lineTo(x,y);
            }

        }

        ctx.strokeStyle =
            "rgba(255,80,130,.25)";

        ctx.lineWidth = 1.5;

        ctx.shadowBlur = 25;

        ctx.shadowColor =
            "rgba(255,40,100,.8)";

        ctx.stroke();

        ctx.restore();

    }


    requestAnimationFrame(animate);

}

requestAnimationFrame(animate);

</script>

</body>
</html>
